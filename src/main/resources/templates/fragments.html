<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo} + ' | ConectaSaude'">ConectaSaude</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body>
<header class="topo" th:fragment="topo">
    <a class="marca" th:href="@{/painel}">
        <span class="marca-simbolo">CS</span>
        <span>ConectaSaude</span>
    </a>
    <nav class="nav" aria-label="Navegacao principal">
        <a sec:authorize="isAnonymous()" th:href="@{/login}">Entrar</a>
        <a sec:authorize="isAnonymous()" th:href="@{/cadastro}">Cadastrar</a>
        <a sec:authorize="hasRole('ALUNO')" th:href="@{/home}">Início</a>
        <a sec:authorize="isAuthenticated()" th:href="@{/painel}">Painel</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/usuarios}">Usuarios</a>
        <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit">Sair</button>
        </form>
    </nav>
</header>
</body>
</html>
